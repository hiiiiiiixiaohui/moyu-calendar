<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="description" content="每日摸鱼人日历 —— 给打工人的一点体面松弛" />
    <meta name="theme-color" content="#0c1f24" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>摸鱼人日历</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true">
      <div class="glow glow-a"></div>
      <div class="glow glow-b"></div>
      <div class="rain"></div>
    </div>

    <main class="stage">
      <div class="sheet-cover" id="loading" aria-live="polite">
        <p class="sheet-cover-tag">摸鱼人日历 · DAILY FISH</p>
        <p class="sheet-cover-title" id="coverTitle">今日宜摸鱼</p>
        <p class="sheet-cover-sub" id="coverSub">给打工人的一点体面松弛</p>
      </div>
      <div class="sheet-error" id="error" hidden></div>

      <div id="content" hidden>
        <header class="hero">
          <p class="hero-tag">摸鱼人日历 · DAILY FISH</p>
          <div class="hero-day">
            <span id="dayNum"></span><small id="weekday"></small>
          </div>
          <p class="hero-ym" id="yearMonth"></p>
          <p class="hero-lunar" id="headerLine"></p>
          <p class="hero-holiday" id="holiday" hidden></p>
        </header>

        <section class="block">
          <h2 class="block-title">今日状态</h2>
          <p class="status" id="status"></p>
        </section>

        <section class="slogan">
          <p class="slogan-big" id="slogan"></p>
          <p class="slogan-bless" id="bless"></p>
        </section>

        <section class="yiji">
          <div class="yi">
            <h3>宜</h3>
            <ul id="suitable"></ul>
          </div>
          <div class="ji">
            <h3>忌</h3>
            <ul id="avoid"></ul>
          </div>
        </section>

        <section class="block">
          <h2 class="block-title">摸鱼生活 · 今天吃什么</h2>
          <div class="food" id="food"></div>

          <h2 class="block-title block-title-gap">摸鱼片单 · 4 部</h2>
          <div class="movies" id="movies"></div>
        </section>

        <section class="block">
          <h2 class="block-title">倒计时 · 假期篇</h2>
          <div class="cd-grid" id="countdowns"></div>
        </section>

        <section class="block">
          <h2 class="block-title" id="paydayTitle">倒计时 · 薪资篇</h2>
          <div class="pay" id="paydays"></div>
        </section>
      </div>

      <nav class="nav" aria-label="历史日期">
        <button type="button" class="nav-btn" id="prev" disabled>前一天</button>
        <button type="button" class="nav-btn" id="today">今天</button>
        <button type="button" class="nav-btn" id="next" disabled>后一天</button>
      </nav>

      <footer class="foot">
        <span id="source"></span>
        <br />
        摸鱼有度，快乐无价 · 祝你今天顺利活到下班
      </footer>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
